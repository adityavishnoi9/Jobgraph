# ==============================
# Postgres connection
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/jobgraph
spring.datasource.username=postgres
spring.datasource.password=Aditya2004@
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
# Flyway runs migrations before Hibernate checks that the tables match the entities.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# OpenAI configuration
# Load the ignored local key file when running from the backend or repository root.
spring.config.import=optional:file:../jobgraph-ai-service/.env[.properties],optional:file:jobgraph-ai-service/.env[.properties]
# ==============================
# Server
# ==============================
server.port=8080
# The browser keeps the login cookie; JavaScript cannot read an HttpOnly cookie.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h
# Gmail's callback must match the redirect URI registered in Google Cloud.
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.gmail.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/gmail/callback}
app.gmail.client-id=${GOOGLE_CLIENT_ID:}
app.gmail.client-secret=${GOOGLE_CLIENT_SECRET:}
app.gmail.token-key=${GMAIL_TOKEN_ENCRYPTION_KEY:}
